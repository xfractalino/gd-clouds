name: Bug report
description: Report a bug with gd-clouds
body:

- type: markdown
  attributes:
    value: |
      - Write a descriptive issue title above.
      - Search [open](https://github.com/xfractalino/gd-clouds/issues) and [closed](https://github.com/xfractalino/gd-clouds/issues?q=is%3Aissue+is%3Aclosed) issues to ensure it has not already been reported.
- type: input
  attributes:
    label: Godot version
    description: >
      Specify the version of Godot you are using. It is shown at the bottom of the editor, and printed by `godot --version`.
    placeholder: 4.7.2.stable
  validations:
    required: true

- type: input
  attributes:
    label: gd-clouds version
    description: >
      Specify the Git commit hash of gd-clouds you built or downloaded. You can run `git rev-parse --short HEAD` inside the folder to check it.
    placeholder: 1572e79
  validations:
    required: true

- type: input
  attributes:
    label: System information
    description: |
      Specify the OS version, the renderer and the graphics card.
    placeholder: Windows 11 - Forward+ - Intel Iris Xe Graphics
  validations:
    required: true

- type: textarea
  attributes:
    label: Issue description
    description: |
      Describe your issue briefly. What doesn't work, and how do you expect it to work instead?
      You can include images or videos with drag and drop, and format code blocks or logs with <code>```</code> tags.
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce
    description: |
      List the steps that make the issue happen, including the values of `CloudsConfig` you use if they differ from the defaults.
      If the demo project in the `project` folder shows the issue as well, say so.
  validations:
    required: true
